<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — InvFlow Management SaaS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-screen">

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-brand">
                <div class="brand-icon">⚡</div>
                <div>
                    <span class="brand-text" style="color:var(--text-primary); font-size:1.25rem;">INVFLOW</span>
                </div>
            </div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your inventory & billing dashboard</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="e.g. admin" required autofocus autocomplete="username">
            </div>

            <div class="form-group" style="margin-bottom:24px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <label for="password" class="form-label" style="margin-bottom:0;">Password</label>
                </div>
                <div class="password-input-group">
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="loginBtn" style="padding:12px; font-size:0.95rem;">
                Sign In to Dashboard
            </button>
        </form>

        <div class="auth-demo-credentials">
            Demo Access: <span onclick="fillDemoCredentials()">Click to fill (admin / admin123)</span>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAlreadyLogged();

        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.innerText = '🔒';
            } else {
                passInput.type = 'password';
                eyeIcon.innerText = '👁️';
            }
        }

        function fillDemoCredentials() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
            showToast('Demo credentials filled', 'info');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!u || !p) {
                showToast('Please enter both username and password', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span style="display:inline-block; animation:spin 1s linear infinite;">⏳</span> Signing in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('auth', 'true');
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800);
                } else {
                    showToast(data.message || 'Invalid username or password', 'error');
                    btn.disabled = false;
                    btn.innerText = 'Sign In to Dashboard';
                }
            } catch (err) {
                console.error('Login Error:', err);
                showToast('Unable to connect to server. Please ensure backend is running.', 'error');
                btn.disabled = false;
                btn.innerText = 'Sign In to Dashboard';
            }
        });
    </script>
</body>
</html>
